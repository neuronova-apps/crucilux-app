<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Crucilux</title>
  <desc id="desc">Símbolo de Crucilux con una cuadrícula de letras y una X destacada.</desc>
  <defs>
    <linearGradient id="plate" x1="18" y1="12" x2="108" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16354d"/>
      <stop offset="1" stop-color="#081522"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#plate)" stroke="#65ddff" stroke-opacity=".42" stroke-width="2"/>
  <rect x="16" y="16" width="96" height="96" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <g font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800" text-anchor="middle">
    <g fill="#0b1b2a" stroke="#9db0c4" stroke-opacity=".32">
      <rect x="38" y="31" width="16" height="16" rx="3"/><rect x="56" y="31" width="16" height="16" rx="3"/><rect x="74" y="31" width="16" height="16" rx="3"/>
      <rect x="38" y="49" width="16" height="16" rx="3"/><rect x="74" y="49" width="16" height="16" rx="3"/>
      <rect x="38" y="67" width="16" height="16" rx="3"/><rect x="56" y="67" width="16" height="16" rx="3"/><rect x="74" y="67" width="16" height="16" rx="3"/>
    </g>
    <rect x="56" y="49" width="16" height="16" rx="3" fill="#65ddff" filter="url(#glow)"/>
    <g fill="#b7c7d6"><text x="46" y="42">C</text><text x="64" y="42">R</text><text x="82" y="42">U</text><text x="46" y="60">U</text><text x="82" y="60">Z</text><text x="46" y="78">Z</text><text x="64" y="78">L</text><text x="82" y="78">O</text></g>
    <text x="64" y="60" fill="#06101d" font-size="9">X</text>
  </g>
  <text x="64" y="99" fill="#aebdcd" font-family="Inter,Arial,sans-serif" font-size="7" font-weight="800" letter-spacing="2" text-anchor="middle">CRUCILUX</text>
</svg>